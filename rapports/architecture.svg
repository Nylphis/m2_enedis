<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 420" width="880" height="420" font-family="Arial, Helvetica, sans-serif">
  <defs>
    <marker id="fleche" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#333333"/>
    </marker>
  </defs>
  <rect width="880" height="420" fill="#ffffff"/>

  <!-- Boîtes -->
  <rect x="20" y="30" width="190" height="70" rx="8" fill="#f5f5f5" stroke="#666666"/>
  <text x="115" y="54" text-anchor="middle" font-size="13" fill="#222"><tspan font-weight="bold">API ADEME</tspan><tspan x="115" dy="17">DPE logements existants</tspan><tspan x="115" dy="17">17 codes postaux</tspan></text>

  <rect x="300" y="30" width="220" height="70" rx="8" fill="#fff2cc" stroke="#d6b656"/>
  <text x="410" y="54" text-anchor="middle" font-size="13" fill="#222"><tspan font-weight="bold">GitHub Actions</tspan> (refresh.yml)<tspan x="410" dy="17">fetch, clean, train (option)</tspan><tspan x="410" dy="17">mensuel (cron) ou manuel</tspan></text>

  <rect x="610" y="30" width="250" height="70" rx="8" fill="#fff2cc" stroke="#d6b656"/>
  <text x="735" y="54" text-anchor="middle" font-size="13" fill="#222"><tspan font-weight="bold">Dépôt GitHub (main)</tspan><tspan x="735" dy="17">code, data/processed/,</tspan><tspan x="735" dy="17">models/ (.joblib, metadata.json)</tspan></text>

  <rect x="560" y="170" width="300" height="230" rx="8" fill="#e1d5e7" stroke="#9673a6"/>
  <text x="710" y="393" text-anchor="middle" font-size="13" fill="#222"><tspan font-weight="bold">Render</tspan> : 2 services, même image Docker</text>

  <rect x="580" y="205" width="260" height="75" rx="8" fill="#dae8fc" stroke="#6c8ebf"/>
  <text x="710" y="231" text-anchor="middle" font-size="13" fill="#222"><tspan font-weight="bold">Appli Streamlit</tspan> (app.py, vues/)<tspan x="710" dy="17">Contexte, Exploration,</tspan><tspan x="710" dy="17">Prédiction, Administration</tspan></text>

  <rect x="580" y="310" width="260" height="65" rx="8" fill="#dae8fc" stroke="#6c8ebf"/>
  <text x="710" y="337" text-anchor="middle" font-size="13" fill="#222"><tspan font-weight="bold">API FastAPI</tspan> (api/main.py)<tspan x="710" dy="17">POST /predict, GET /info, /docs</tspan></text>

  <rect x="20" y="215" width="190" height="55" rx="8" fill="#d5e8d4" stroke="#82b366"/>
  <text x="115" y="238" text-anchor="middle" font-size="13" fill="#222">Particulier<tspan x="115" dy="17">(navigateur)</tspan></text>

  <rect x="20" y="315" width="190" height="55" rx="8" fill="#d5e8d4" stroke="#82b366"/>
  <text x="115" y="338" text-anchor="middle" font-size="13" fill="#222">Application cliente<tspan x="115" dy="17">(requêtes HTTP)</tspan></text>

  <!-- Flèches -->
  <g stroke="#333333" stroke-width="1.5" fill="none">
    <line x1="210" y1="65" x2="298" y2="65" marker-end="url(#fleche)"/>
    <line x1="520" y1="65" x2="608" y2="65" marker-end="url(#fleche)"/>
    <line x1="735" y1="100" x2="735" y2="168" marker-end="url(#fleche)"/>
    <line x1="619" y1="205" x2="444" y2="102" marker-end="url(#fleche)" stroke-dasharray="6 4"/>
    <line x1="210" y1="242" x2="578" y2="242" marker-end="url(#fleche)"/>
    <line x1="210" y1="342" x2="578" y2="342" marker-end="url(#fleche)"/>
  </g>

  <!-- Libellés des flèches -->
  <g font-size="11" fill="#444444" text-anchor="middle">
    <text x="255" y="120">téléchargement<tspan x="255" dy="14">(incrémental ou complet)</tspan></text>
    <text x="565" y="120">commit des<tspan x="565" dy="14">fichiers modifiés</tspan></text>
    <text x="745" y="130" text-anchor="start">redéploiement<tspan x="745" dy="14">automatique</tspan></text>
    <text x="470" y="160">lancement manuel<tspan x="470" dy="14">(API GitHub)</tspan></text>
    <text x="395" y="234">formulaire, graphiques</text>
    <text x="395" y="334">JSON</text>
  </g>
</svg>
